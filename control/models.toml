# Role routing. Contract tier (layer 3): this file selects the cognitive black
# box, so changing it is a human-merged change even though it is one line.
#
# NO KEYS IN THIS FILE, EVER. Only the NAME of the environment variable.
#
# Everything speaks the OpenAI-compatible /chat/completions shape, so one
# gateway can front several model families and switching providers stays a
# config change rather than a code change.
#
# ---------------------------------------------------------------------------
# Measured facts about this endpoint (verified against the running service,
# not the docs -- the constitution requires checking the authoritative layer):
#
#   * All models here are REASONING models. The thinking trace is billed
#     against the same budget as the answer, so a tight max_tokens returns
#     HTTP 200 with EMPTY content. max_tokens must be generous.
#     SenseNova returns the trace in `reasoning`; DeepSeek in `reasoning_content`.
#   * 429 here means the request rate RAMPED too fast, not that quota ran out.
#     It clears after ~15s. llm.py paces every call and backs off 15/30/60s.
#   * `sensenova-u1-fast` is documented but returns "model is not found" at
#     this endpoint. Not routed. Re-test before adding.
#   * Quotas are per-call, not per-token, so the ledger's CALL caps are the
#     binding gate; usd_* stay 0 and the USD caps are the inert belt.
#
# Quotas: sensenova-6.8-flash-lite 1500/5h; deepseek-v4-flash 500/5h;
#         glm-5.2 500/5h.
# ---------------------------------------------------------------------------

[budget]
cycle_usd = 1.0
campaign_usd = 25.0
# One cycle = 1 mutate + 2 review + probe scoring, so 40 leaves headroom for
# retries while still stopping a runaway loop well inside the 5-hour quota.
cycle_calls = 40
campaign_calls = 1000

# The capability-critical role: reads the whole kernel, returns complete
# replacement files. GLM-5.2 is chosen for output length (128K max output,
# 1M context) -- whole-file replacement is bounded by how much a model can
# WRITE, not how much it can read.
[roles.mutate]
id = "mutate"
lineage = "zhipu"
base_url = "https://token.sensenova.cn/v1"
model = "glm-5.2"
api_key_env = "SENSENOVA_API_KEY"
temperature = 0.2
max_tokens = 32000
timeout = 900
usd_in = 0.0
usd_out = 0.0

# Reviewers optimise FAILURE INDEPENDENCE, not model count.
#
# Three families are available here and the mutator uses one of them. Routing
# the mutator's own family as a reviewer would be the WORST available choice
# for independence -- a blind spot in that model's reasoning would appear on
# both sides of the gate. So review runs two heterogeneous families and the
# quorum becomes 2/2: unanimity. Stricter than a 2-of-3 that includes the
# author's own lineage.
[[roles.review.slots]]
id = "review:deepseek"
lineage = "deepseek"
base_url = "https://token.sensenova.cn/v1"
model = "deepseek-v4-flash"
api_key_env = "SENSENOVA_API_KEY"
temperature = 0.0
max_tokens = 8000
timeout = 600
usd_in = 0.0
usd_out = 0.0

[[roles.review.slots]]
id = "review:sensenova"
lineage = "sensenova"
base_url = "https://token.sensenova.cn/v1"
model = "sensenova-6.8-flash-lite"
api_key_env = "SENSENOVA_API_KEY"
temperature = 0.0
max_tokens = 8000
timeout = 600
usd_in = 0.0
usd_out = 0.0

# Cheapest adequate, highest quota. Executable check.py rubrics are preferred
# and cost nothing; this role only handles what cannot be asserted.
[roles.score]
id = "score"
lineage = "sensenova"
base_url = "https://token.sensenova.cn/v1"
model = "sensenova-6.8-flash-lite"
api_key_env = "SENSENOVA_API_KEY"
temperature = 0.0
max_tokens = 4000
timeout = 600
usd_in = 0.0
usd_out = 0.0

# Tier C only. Not used in P0.
[roles.escalate]
id = "escalate"
lineage = "deepseek"
base_url = "https://token.sensenova.cn/v1"
model = "deepseek-v4-flash"
api_key_env = "SENSENOVA_API_KEY"
temperature = 0.2
max_tokens = 32000
timeout = 900
usd_in = 0.0
usd_out = 0.0
